# DISABLED (2026-09-18): image builds are DOMESTIC-ONLY.
#
# Policy (user directive, 2026-09-10): GitHub-hosted runners must NEVER push to
# the domestic Harbor or any CN server — foreign runner IPs hammering domestic
# endpoints risk IP bans. Since the 2026-09-17 Harbor rebuild every documented
# push credential returns 401, so a run from here fails at `docker login` too.
#
# Where this image is built instead: the Gitee Go pipeline committed at
# `.workflow/docker-publish.yml` (CN→CN), which pushes
# `<HARBOR_HOST>/finddata/fd-cn-report` as latest / <short-sha> / <tag>; the
# previous GitHub build/tag/push steps are in git history to mirror them.
#
# This stub exists so the file path stays claimed and fails loudly if anyone
# re-points it at a registry.
name: docker-publish (disabled)

on: workflow_dispatch

jobs:
  refuse:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse
        run: |
          echo "::error::Image builds are domestic-only (Gitee Go / box). Do not re-enable pushes from GitHub runners."
          exit 1
