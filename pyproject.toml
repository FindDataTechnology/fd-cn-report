[project]
name = "fd-cn-report"
version = "0.3.3"
description = "Chinese financial report MCP server — 31 Shenwan industry AI rule system, outline extraction, AI structured extraction, Elasticsearch store + search, industry rules dashboard"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "FindDataTechnology" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastmcp>=2.0",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "pypdf>=4.0",
    "jsonschema>=4.0",
    "elasticsearch>=8.0",
    "akshare>=1.13",
    "pandas>=2.0",
    "pymupdf>=1.28.0",
    "lxml>=4.9",
    "litellm>=1.0",
    "minio>=7.2.0",
]

[project.urls]
Homepage = "https://github.com/FindDataTechnology/fd-cn-report"
Repository = "https://github.com/FindDataTechnology/fd-cn-report"
Issues = "https://github.com/FindDataTechnology/fd-cn-report/issues"
Changelog = "https://github.com/FindDataTechnology/fd-cn-report/releases"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.entry-points."fd_open_data_mcp.datasources"]
fd-cn-report = "catalog:CATALOG"

[tool.setuptools]
py-modules = [
    "server",
    "cnreport_database",
    "cnreport_models",
    "cnreport_tools",
    "cninfo_client",
    "financials_client",
    "indicators_client",
    "indicators_models",
    "script_extractors",
    "indicators_csv_migration",
    "report_cache",
    "report_section_map",
    "llm_section_cache",
    "llm_adapter",
    "rules_db",
    "rules_models",
    "rules_skills",
    "industry_coverage",
    "industry_taxonomy",
    "selfcheck",
    "selfcheck_cache",
    "migrate",
    "hk_stock_client",
    "official_client_utils",
    "sse_client",
    "szse_client",
    "bse_client",
    "csrc_client",
    "ministry_stats_client",
    "catalog",
]

[tool.setuptools.package-data]
"*" = ["indicator_rules.json", "indicator_rules_deduped.json", "docs/*.json"]

